name: dfir-duck

services:
  dfir-duck:
    # Aucun argument de build ici : les versions d'outils sont pinnées dans les
    # `ARG` du Dockerfile. Ce fichier ne décrit que l'exécution.
    build:
      context: .
    image: ${DFIR_DUCK_IMAGE:-dfir-duck:latest}
    container_name: dfir-duck
    restart: unless-stopped
    # Variables compose + surcharges ponctuelles de app/config.yaml + secrets.
    env_file:
      - .env
    environment:
      # Chemins DANS le conteneur ; les volumes ci-dessous disent d'où ils
      # viennent sur l'hôte.
      DATA_DIR: /app/data
      PENDING_DIR: /app/data/uploads/_pending
      OUTPUT_DIR: /app/data/output
    # Trois montages, pour pouvoir éparpiller les dossiers lourds sur l'hôte :
    # le pool d'arrivée (souvent un partage alimenté par un serveur d'upload)
    # et les sorties d'outils (le plus gros volume) peuvent vivre ailleurs que
    # le reste. Laissés vides, ils retombent sous DFIR_DUCK_DIRECTORY et
    # l'arborescence est celle d'avant.
    volumes:
      - ${DFIR_DUCK_DIRECTORY:-./data}:/app/data
      - ${DFIR_PENDING_DIRECTORY:-${DFIR_DUCK_DIRECTORY:-./data}/uploads/_pending}:/app/data/uploads/_pending
      - ${DFIR_OUTPUT_DIRECTORY:-${DFIR_DUCK_DIRECTORY:-./data}/output}:/app/data/output
    ports:
      - "${DFIR_DUCK_PORT:-80}:8000"
    # Limite mémoire du conteneur = garde-fou principal pour les runs d'outils
    # (DFIR-OGRE est gourmand). Ajuster selon la machine hôte.
    mem_limit: ${DFIR_DUCK_MEM_LIMIT:-16g}
    # Limite CPU du conteneur, en nombre de cœurs (équivalent `docker run
    # --cpus`). Traduite en cgroup `cpu.max`, relue par l'app (sysinfo.py) pour
    # afficher la vraie limite dans l'onglet Overview et /metrics.
    cpus: ${DFIR_DUCK_CPU_LIMIT:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dfir-net

# Réseau partagé : prêt pour des services voisins ajoutés plus tard
# (serveur SFTP mappé sur
# data/uploads/_pending, endpoint de modèles, ...).
networks:
  dfir-net:
    name: dfir-net
    driver: bridge
