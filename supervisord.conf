; Processus du conteneur : l'application.
;
; supervisord tourne en root — seul capable d'écrire sur la sortie standard du
; conteneur — et son programme tourne sous l'utilisateur `dfir`, qui n'a besoin
; d'aucun privilège.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:app]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
user=dfir
environment=HOME="/home/dfir",USER="dfir"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=20
